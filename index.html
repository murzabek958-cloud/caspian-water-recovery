<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8"/>
<meta name="google-site-verification" content="mwitdqhIO6JiLPtiJc46Rfd4AMu_0RRfEHT0E7zb394"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="description" content="Caspian Water Recovery — Каспий теңізінің булануын AI мониторингі және локальды микро-конденсация платформасы. Smart Ion Buoys · Magnus–Tetens · NASA POWER. Caspian Hackathon 2026"/>
<meta property="og:title" content="💧 Caspian Water Recovery — Smart Ion Buoys"/>

<title>💧 Caspian Water Recovery — Smart Ion Buoys</title>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
html,body{height:100%;overflow:hidden;background:#0b1016}
#wrap{position:absolute;inset:0;overflow:hidden}
#frame{position:absolute;width:134%;height:136%;left:-17%;top:-16%;border:0}
#map{position:absolute;inset:0;display:none}
.topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:9px 12px;background:linear-gradient(180deg,rgba(8,12,18,.95),rgba(8,12,18,.7) 80%,transparent);pointer-events:none}
.topbar>*{pointer-events:auto}
.logo{display:flex;align-items:center;gap:9px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.85);margin-right:6px}
.logo .drop{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7fd0ff,#1f6fae 75%);
  display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 0 14px rgba(31,111,174,.8)}
.logo b{font-size:14px;letter-spacing:.4px}
.logo small{display:block;color:#9fb8cc;font-size:9px;font-weight:400;margin-top:1px}
.pill{border:0;border-radius:20px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;color:#eaf4fb;
  background:rgba(255,255,255,.13);backdrop-filter:blur(8px);transition:.2s;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.pill:hover{background:rgba(255,255,255,.26)}
.pill.on{background:linear-gradient(135deg,#2f80ed,#1f6fae);color:#fff;box-shadow:0 0 12px rgba(47,128,237,.65)}
.pill.ai{background:linear-gradient(135deg,#8e44ad,#5e2f80);color:#fff}
#legend{position:absolute;left:12px;bottom:30px;z-index:20;background:rgba(13,18,26,.9);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:9px 13px;width:225px;color:#d7ecfa}
#legend .t{font-size:11px;font-weight:700;color:#7fd0ff;margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px}
#legend .bar{height:9px;border-radius:5px;background:linear-gradient(90deg,#4fc3f7,#ffd166 33%,#ff8c42 66%,#ff3b3b)}
#legend .tick{display:flex;justify-content:space-between;font-size:9px;color:#9fb8cc;margin-top:3px}
#chatBtn{position:absolute;right:16px;bottom:34px;z-index:40;width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;
  background:linear-gradient(135deg,#8e44ad,#5e2f80);color:#fff;font-size:25px;box-shadow:0 4px 18px rgba(94,47,128,.7)}
#chat{position:absolute;right:16px;bottom:102px;z-index:40;width:360px;max-height:62vh;display:none;flex-direction:column;
  background:rgba(13,18,26,.98);border:1px solid rgba(255,255,255,.1);border-radius:14px;overflow:hidden;backdrop-filter:blur(14px)}
#chat.open{display:flex}
#chat .hd{padding:10px 14px;background:linear-gradient(135deg,#8e44ad,#5e2f80);color:#fff;font-size:12px;font-weight:700}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:12px;line-height:1.55;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:#1f6fae;color:#fff;border-bottom-right-radius:3px}
.msg.a{align-self:flex-start;background:rgba(255,255,255,.08);color:#d7ecfa;border-bottom-left-radius:3px}
#chat .in{display:flex;gap:6px;padding:8px;border-top:1px solid rgba(255,255,255,.08)}
#q{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:9px 12px;color:#fff;font-size:12px;outline:none}
#send{border:0;border-radius:10px;background:#8e44ad;color:#fff;padding:0 14px;cursor:pointer;font-size:14px}
footer{position:absolute;bottom:5px;left:12px;z-index:20;font-size:9px;color:rgba(255,255,255,.5);text-shadow:0 1px 3px #000;pointer-events:none}
.mapboxgl-ctrl-attrib{opacity:.5}
@media(max-width:720px){#chat{width:92%}.logo small{display:none}#legend{width:170px}}
</style>
</head>
<body>

<div id="wrap">
  <iframe id="frame" src=""></iframe>
  <div id="map"></div>
</div>

<div class="topbar">
  <div class="logo"><span class="drop">💧</span>
    <span><b>CASPIAN WATER RECOVERY</b><small>Smart Ion Buoys · Локальды микро-конденсация · Hackathon 2026</small></span>
  </div>
  <button class="pill on" data-m="evap">💨 Булану</button>
  <button class="pill" data-m="temp">🌡️ Жылулық</button>
  <button class="pill" data-m="wind">🌬️ Жел ағыны</button>
  <button class="pill" data-m="rain">🌧️ Жауын</button>
  <button class="pill" data-m="thunder">⛈️ Найзағай</button>
  <button class="pill" data-m="clouds">☁️ Бұлттар</button>
  <button class="pill" data-m="hum">💧 Ылғал</button>
  <button class="pill" data-m="press">📊 Қысым</button>
  <button class="pill" data-m="sea">🌊 Теңіз t°</button>
  <button class="pill" data-m="snow">❄️ Қар</button>
  <button class="pill ai" id="btnAI2">🤖 AI</button>
</div>

<div id="legend">
  <div class="t" id="lTitle">💨 Булану (мм/күн)</div>
  <div class="bar"></div>
  <div class="tick" id="lTick"><span>3</span><span>7</span><span>11</span><span>15+</span></div>
</div>

<button id="chatBtn">🤖</button>
<div id="chat">
  <div class="hd">🤖 Caspian AI — нақты деректермен толық шешім береді</div>
  <div id="msgs"></div>
  <div class="in"><input id="q" placeholder="Сұрақ қойыңыз... (мыс: шешімдерің қандай?)"/><button id="send">➤</button></div>
</div>

<footer>💧 CASPIAN WATER RECOVERY · NASA POWER · OWM · CMEMS · I Халықаралық Caspian Hackathon 2026</footer>

<script>
mapboxgl.accessToken = 'pk.eyJ1IjoibWFudXJrYXlldiIsImEiOiJjbXNjdGx3YWMwd3o1MnpzNXd4ZTB3a20xIn0.TFkYBesFueHqrCjX6wzUSw';
const $ = id => document.getElementById(id);
const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
const clean = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [k.trim(), v]));
const S = {};

// ── Карталар (қырқылған, логотипсіз) ──
const M = {
  evap:{own:1,t:'💨 Булану (мм/күн)',ticks:['3','7','11','15+']},
  temp:{u:'v',l:'temperature-2m',t:'🌡️ Жылулық (°C)',ticks:['-10','0','15','30','45']},
  wind:{u:'w',o:'wind',t:'🌬️ Жел ағыны (м/с)',ticks:['0','5','10','20','30+']},
  rain:{u:'v',l:'rain-3h',t:'🌧️ Жауын-шашын',ticks:['аз','орта','қатты','өте']},
  thunder:{u:'w',o:'rain',t:'⛈️ Найзағай / жауын',ticks:['жоқ','әлсіз','орта','күшті']},
  clouds:{u:'v',l:'satellite',t:'☁️ Бұлттар (спутник)',ticks:['ашық','аз','орта','тұтас']},
  hum:{u:'w',o:'humidity',t:'💧 лғалдылық (%)',ticks:['0','25','50','75','100']},
  press:{u:'v',l:'pressure',t:'📊 Қысым (hPa)',ticks:['980','1000','1020','1040']},
  sea:{u:'w',o:'sst',t:'🌊 Теңіз температурасы (°C)',ticks:['0','10','20','28','32+']},
  snow:{u:'v',l:'snow-new-ac',t:'❄️ Қар жамылғысы',ticks:['0','5','20','50+']}
};
function openMode(k){
  const c=M[k];
  $('lTitle').textContent=c.t;
  $('lTick').innerHTML=c.ticks.map(x=>`<span>${x}</span>`).join('');
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===k));
  if(c.own){$('frame').style.display='none';$('map').style.display='block';setTimeout(()=>map.resize(),80);return;}
  $('map').style.display='none';$('frame').style.display='block';
  $('frame').src=c.u==='v'?`https://embed.ventusky.com/?p=44.5;51.5;6&l=${c.l}&w=soft`
    :`https://embed.windy.com/embed2.html?type=map&location=coordinates&metricRain=mm&metricTemp=%C2%B0C&metricWind=kt&zoom=5&overlay=${c.o}&product=ecmwf&level=surface&lat=44.5&lon=51.5`;
}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>openMode(b.dataset.m));
$('btnAI2').onclick=()=>$('chat').classList.toggle('open');
$('chatBtn').onclick=()=>$('chat').classList.toggle('open');

// ── Біздің булану картасы (жұмсақ, теңіз пішінінде) ──
const map = new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/dark-v11',center:[51.9,44.9],zoom:5.6});
map.addControl(new mapboxgl.NavigationControl(),'top-right');
map.on('load', async () => {
  map.addSource('kz-sector',{type:'geojson',data:{type:'Feature',geometry:{type:'Polygon',coordinates:[[[48.5,41.7],[55.1,41.7],[55.1,47.7],[48.5,47.7],[48.5,41.7]]]}}});
  map.addLayer({id:'kz-line',type:'line',source:'kz-sector',paint:{'line-color':'#ffd166','line-width':2,'line-dasharray':[2,2],'line-opacity':.6}});
  let grid=[];
  try{const r=await fetch('caspian_grid.json');if(r.ok)grid=(await r.json()).map(clean);}catch(e){}
  map.addSource('grid',{type:'geojson',data:{type:'FeatureCollection',features:grid.map(p=>({type:'Feature',geometry:{type:'Point',coordinates:[p.lon,p.lat]},properties:{evap:p.evaporation}}))}});
  // Жұмсақ, табиғи градиент (қызыл таяқша емес)
  map.addLayer({id:'h-evap',type:'heatmap',source:'grid',paint:{
    'heatmap-weight':['interpolate',['linear'],['get','evap'],3,.25,15,.9],
    'heatmap-radius':['interpolate',['linear'],['zoom'],3,40,5,70,7,110,9,150],
    'heatmap-intensity':['interpolate',['linear'],['zoom'],3,.7,7,1.1],
    'heatmap-opacity':['interpolate',['linear'],['zoom'],3,.9,7,.7],
    'heatmap-color':['interpolate',['linear'],['heatmap-density'],
      0,'rgba(0,0,0,0)',.2,'rgba(79,195,247,.55)',.45,'#ffd166',.7,'#ff8c42',1,'#e23b2e']}});
});

// ── Нақты деректерді жинау ──
(async()=>{
  try{
    const r=await fetch('caspian_sea_grid.json');
    if(r.ok){
      const sea=(await r.json()).map(clean);
      const kz=sea.filter(p=>p.lat>=42.33);
      S.avgEvap=+avg(kz.map(p=>p.evaporation)).toFixed(2);
      S.sst=+avg(kz.map(p=>p.sst)).toFixed(2);
      S.temp=+avg(kz.map(p=>p.temp)).toFixed(2);
      S.wind=+avg(kz.map(p=>p.wind)).toFixed(2);
      S.hum=+avg(kz.map(p=>p.humidity)).toFixed(1);
      S.top5=[...kz].sort((a,b)=>b.evaporation-a.evaporation).slice(0,5);
    }
  }catch(e){}
  try{const d=await(await fetch('/api/weather')).json();if(d.ok)S.cities=d.data;}catch(e){}
  try{
    const e=new Date(),s=new Date();s.setDate(e.getDate()-30);
    const f=d=>d.toISOString().slice(0,10).replace(/-/g,'');
    const d=await(await fetch(`https://power.larc.nasa.gov/api/temporal/daily/point?parameters=T2M,RH2M,WS2M,EVPTRNS&community=AG&longitude=51.9&latitude=44.9&start=${f(s)}&end=${f(e)}&format=JSON`)).json();
    const p=d.properties.parameter,arr=Object.keys(p.T2M).map(x=>+p.EVPTRNS[x]).filter(v=>!isNaN(v)&&v>-900);
    const n=arr.length,X=Array.from({length:n},(_,i)=>i),sX=X.reduce((a,b)=>a+b,0),sY=arr.reduce((a,b)=>a+b,0),
      sXY=X.reduce((a,v,i)=>a+v*arr[i],0),sXX=X.reduce((a,v)=>a+v*v,0);
    S.trendE=+(((n*sXY-sX*sY)/(n*sXX-sX*sX))||0).toFixed(3);
    S.nasaEvap=+(arr.slice(-7).reduce((a,b)=>a+b,0)/7).toFixed(2);
  }catch(e){}
})();

// ═══════════════════════════════════════════════════════════
// 🤖 AI: Gemini (берілген кілт) → Pollinations (қор LLM) → жергілікті жауап
// ═══════════════════════════════════════════════════════════
const GEMINI_KEY = 'AQ.Ab8RN6IHmY02hpob0Dt67ckAgmforTN6cAuW5KBVDI8GWCo9gA';
const PERSONA = `Сен — Caspian Water Recovery экологиялық платформасының AI көмекшісісің. Қазақ тілінде еркін, жылы әрі кәсіби, сенімді дос сияқты сөйлейсің, кейде эмодзи қолданасың. Жауаптарың нақты сандарға негізделеді. Шешім/ұсыныс сұралса — ТОЛЫҚ ШЕШІМДІ айт: 1) Деректерді бақылау (NASA POWER, OpenWeather, CMEMS); 2) Ақылды таңдау (Магнус–Тетенс теңдеулері); 3) Локальды микро-конденсация: түнде радиациялық салқындату, ылғалды желде пассивті торлар, теңіз бетінде Smart Ion Buoys (күн+толқын қуаты, 0–50 м ионизация, бу молекулаларын жаңбыр/тұман қылып қайтару). Экономика: 500 буй, $125,000, 91,250 м³/жыл, өтелу 1.4 жыл.`;
function ctx(){return ` Платформаның нақты деректері (Каспий, Қазақстан секторы): булану ${S.avgEvap||'—'} мм/күн, су t° ${S.sst||'—'}°C, ауа t° ${S.temp||'—'}°C, жел ${S.wind||'—'} м/с, ылғал ${S.hum||'—'}%. NASA(30күн): булану ${S.nasaEvap||'—'} мм/күн, тренд ${S.trendE||0}. Ең қауіпті зоналар: ${S.top5?S.top5.map(p=>p.lat+','+p.lon+' ('+p.evaporation.toFixed(1)+')').join('; '):'—'}. Қалалар: ${S.cities?S.cities.map(c=>c.city+' '+c.temp+'°C/'+c.humidity+'%').join(', '):'—'}.`;}
function md(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');}

async function gemini(prompt, withSearch, model){
  const body={contents:[{role:'user',parts:[{text:prompt}]}],systemInstruction:{parts:[{text:PERSONA+ctx()}]}};
  if(withSearch)body.tools=[{google_search:{}}];
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_KEY}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw 0;
  const d=await r.json();
  const t=(d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();
  if(!t)throw 0; return t;
}
async function pollinations(prompt){
  const full=`${PERSONA}${ctx()}\n\nПайдаланушы сұрағы: ${prompt}\n\nЖауапты қазақша, 2-5 сөйлеммен, нақты сандармен бер.`;
  const r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(full));
  const t=(await r.text()).trim();
  if(!t||t.length<3)throw 0; return t;
}
function localAnswer(q){
  q=q.toLowerCase();
  if(q.includes('шешім')||q.includes('идея'))return 'Біздің шешім — бүкіл теңізді емес, нақты координаттарды бағыттау: 1) NASA POWER/OWM/CMEMS деректерін нақты уақытта талдау; 2) Магнус–Тетенс арқылы конденсация тиімді нүктені табу; 3) Түнде радиациялық салқындату, ылғалды желде пассивті торлар, теңіз бетінде Smart Ion Buoys. Экономика: 500 буй → 91,250 м³/жыл, өтелу 1.4 жыл. 💧';
  if(q.includes('булан'))return `Қазір орташа булану — ${S.avgEvap} мм/күн. Ең қауіпті зона: ${S.top5[0].lat}, ${S.top5[0].lon} (${S.top5[0].evaporation} мм/күн).`;
  if(q.includes('темп')||q.includes('жылу'))return `Ауа ${S.temp}°C, су ${S.sst}°C.`;
  if(q.includes('ылғал'))return `Орташа ылғал — ${S.hum}%.`;
  if(q.includes('жел'))return `Орташа жел — ${S.wind} м/с.`;
  if(q.includes('буй')||q.includes('эконом')||q.includes('пайда'))return 'Smart Ion Buoys: 500 буй, $125,000 инвестиция, 250 м³/күн қайтарылған су, өтелу 1.4 жыл.';
  if(q.includes('сәлем')||q.includes('салем'))return 'Сәлеметсіз бе! 👋 Мен Caspian AI-мын. Шешім, булану, температура, буйлар немесе болжам туралы сұраңыз!';
  return `Мен Caspian AI-мын! Булану қазір ${S.avgEvap} мм/күн. Сұраңыз: шешім / булану / температура / буйлар / болжам.`;
}
function pushMsg(t,cls){const m=document.createElement('div');m.className='msg '+cls;m.innerHTML=t;$('msgs').appendChild(m);$('msgs').scrollTop=$('msgs').scrollHeight;}
async function ask(){
  const q=$('q').value.trim();if(!q)return;$('q').value='';
  pushMsg(q,'u');
  const hold=document.createElement('div');hold.className='msg a';hold.textContent='🤖 Ойланып жатырмын...';$('msgs').appendChild(hold);$('msgs').scrollTop=$('msgs').scrollHeight;
  const prompt=`Пайдаланушы сұрағы: ${q}. Жауапты қазақша бер. Нақты уақыттағы ақпарат керек болса (ауа райы, Каспий деңгейі) — интернеттен іздеп, толық талдау/шешім қос.`;
  let ok=false;
  try{hold.innerHTML='🤖 '+md(await gemini(prompt,true,'gemini-2.0-flash'));ok=true;}catch(e){}
  if(!ok)try{hold.innerHTML='🤖 '+md(await gemini(prompt,false,'gemini-2.0-flash'));ok=true;}catch(e){}
  if(!ok)try{hold.innerHTML='🤖 '+md(await gemini(prompt,false,'gemini-1.5-flash'));ok=true;}catch(e){}
  if(!ok)try{hold.innerHTML='🤖 '+md(await pollinations(prompt));ok=true;}catch(e){}
  if(!ok)hold.innerHTML='🤖 '+localAnswer(q);
  $('msgs').scrollTop=$('msgs').scrollHeight;
}
$('send').onclick=ask;
$('q').onkeydown=e=>{if(e.key==='Enter')ask();};
pushMsg('Сәлеметсіз бе! 👋 Мен Caspian AI-мын — нақты деректерді жинап, толық шешім айтамын. Мысалы: «Шешімдерің қандай?», «Булану қанша?», «Каспий неге тартылып жатыр?»','a');

openMode('evap');
</script>
</body>
</html>
