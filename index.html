<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💧 Caspian Water Recovery</title>

<!-- Leaflet карта -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>

<!-- Chart.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

<style>
  :root {
    --bg:      #0a0e1a;
    --card:    #0d1b2a;
    --border:  #1e3a5f;
    --accent:  #00bcd4;
    --text:    #e0e0e0;
    --muted:   #90caf9;
    --green:   #4caf50;
    --orange:  #ff9800;
    --red:     #f44336;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, #0d47a1, #006064);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--accent);
    position: sticky; top: 0; z-index: 1000;
  }
  header h1 { font-size: 20px; color: var(--accent); letter-spacing: .5px; }
  .live-badge {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
  }
  .dot {
    width: 8px; height: 8px; background: var(--green);
    border-radius: 50%; animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* ── BEST BANNER ── */
  #bestBanner {
    background: linear-gradient(90deg, #1a237e, #006064);
    border-left: 4px solid var(--green);
    padding: 12px 24px;
    font-size: 14px;
    min-height: 44px;
  }
  #bestBanner span { color: var(--green); font-weight: bold; }

  /* ── MAIN GRID ── */
  .main {
    display: grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: auto auto;
    gap: 16px;
    padding: 16px 24px;
  }
  @media(max-width:768px) {
    .main { grid-template-columns: 1fr; padding: 12px; }
  }

  /* ── MAP ── */
  #map {
    grid-row: 1 / 3;
    height: 480px;
    border-radius: 12px;
    border: 1px solid var(--border);
    z-index: 1;
  }
  @media(max-width:768px) { #map { grid-row: auto; height: 320px; } }

  /* ── CARDS ── */
  .cards {
    display: flex; flex-direction: column; gap: 10px;
    overflow-y: auto; max-height: 480px;
  }
  @media(max-width:768px) {
    .cards {
      flex-direction: row; flex-wrap: wrap;
      max-height: none; overflow: visible;
    }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    transition: transform .2s, border-color .2s;
    flex: 1; min-width: 140px;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card.active { border-color: var(--accent); background: #0a2040; }
  .card-city { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .card-index { font-size: 30px; font-weight: bold; }
  .card-status { font-size: 11px; margin-bottom: 8px; }
  .card-rows { font-size: 11px; }
  .card-row { display:flex; justify-content:space-between; padding: 2px 0; color: var(--muted); }
  .card-row b { color: var(--text); }
  .card-tech {
    margin-top: 8px; font-size: 10px; color: var(--accent);
    background: #0a1628; padding: 4px 8px; border-radius: 5px;
  }

  /* ── CHARTS ── */
  .charts {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
  }
  .chart-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .chart-box h4 { color: var(--muted); font-size: 13px; margin-bottom: 12px; }

  /* ── AI BOX ── */
  .ai-box {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, var(--card), #0a2744);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 18px;
  }
  .ai-box h4 { color: var(--accent); margin-bottom: 10px; font-size: 14px; }
  .ai-text { font-size: 13px; line-height: 1.8; color: #cfd8dc; }
  .ai-text b { color: var(--green); }

  /* ── LOADER ── */
  #loader {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 9999; gap: 16px;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    text-align: center; padding: 14px;
    color: #455a64; font-size: 11px;
    border-top: 1px solid var(--border);
  }

  .refresh-btn {
    background: var(--accent); color: #000;
    border: none; border-radius: 6px;
    padding: 6px 14px; font-size: 12px;
    cursor: pointer; font-weight: bold;
    margin-left: 12px;
  }
  .refresh-btn:hover { opacity: .85; }
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="spinner"></div>
  <div style="color:var(--muted);font-size:14px">Каспий деректері жүктелуде...</div>
</div>

<!-- HEADER -->
<header>
  <h1>💧 Caspian Water Recovery</h1>
  <div class="live-badge">
    <div class="dot"></div>
    <span id="timeLabel">—</span>
    <button class="refresh-btn" onclick="loadData()">🔄 Жаңарту</button>
  </div>
</header>

<!-- BEST BANNER -->
<div id="bestBanner">⏳ Жүктелуде...</div>

<!-- MAIN -->
<div class="main">
  <!-- MAP -->
  <div id="map"></div>

  <!-- CARDS -->
  <div class="cards" id="cards"></div>

  <!-- CHARTS -->
  <div class="charts">
    <div class="chart-box">
      <h4>📊 Конденсация индексі (%)</h4>
      <canvas id="indexChart"></canvas>
    </div>
    <div class="chart-box">
      <h4>💧 Ылғалдылық vs 🌡️ Температура</h4>
      <canvas id="humidChart"></canvas>
    </div>
  </div>

  <!-- AI BOX -->
  <div class="ai-box">
    <h4>🤖 AI Талдауы</h4>
    <div class="ai-text" id="aiText">Жүктелуде...</div>
  </div>
</div>

<footer>
  💧 Caspian Water Recovery &nbsp;|&nbsp;
  I Халықаралық CASPIAN HACKATHON 2026 &nbsp;|&nbsp;
  Деректер: OpenWeatherMap (нақты уақыт)
</footer>

<script>
// ── Карта ──
const map = L.map('map', { zoomControl: true }).setView([45.5, 51.5], 6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© CartoDB'
}).addTo(map);

let heatLayer = null;
let markers   = [];
let indexChart = null, humidChart = null;

function getColor(i) {
  return i >= 70 ? '#4caf50' : i >= 40 ? '#ff9800' : '#f44336';
}
function getLabel(i) {
  return i >= 70 ? '🟢 ТИІМДІ' : i >= 40 ? '🟡 ОРТАША' : '🔴 ТИІМСІЗ';
}

function renderCards(data) {
  const container = document.getElementById('cards');
  container.innerHTML = '';
  data.forEach((d, i) => {
    const color = getColor(d.index);
    const label = getLabel(d.index);
    const div = document.createElement('div');
    div.className = 'card';
    div.id = `card-${i}`;
    div.innerHTML = `
      <div class="card-city">📍 ${d.city}</div>
      <div class="card-index" style="color:${color}">${d.index}%</div>
      <div class="card-status" style="color:${color}">${label}</div>
      <div class="card-rows">
        <div class="card-row"><span>🌡️ Темп</span><b>${d.temp}°C</b></div>
        <div class="card-row"><span>💧 Ылғал</span><b>${d.humidity}%</b></div>
        <div class="card-row"><span>🌬️ Жел</span><b>${d.wind} м/с</b></div>
        <div class="card-row"><span>🌫️ Шық</span><b>${d.dew}°C</b></div>
      </div>
      <div class="card-tech">⚙️ ${d.tech}</div>
    `;
    div.onclick = () => {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
      div.classList.add('active');
      map.flyTo([d.lat, d.lon], 9, { duration: 1 });
    };
    container.appendChild(div);
  });
}

function renderMap(data) {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  if (heatLayer) { map.removeLayer(heatLayer); }

  const heatData = data.map(d => [d.lat, d.lon, d.index / 100]);
  heatLayer = L.heatLayer(heatData, { radius: 60, blur: 40, minOpacity: 0.3 }).addTo(map);

  data.forEach(d => {
    const color = getColor(d.index);
    const label = getLabel(d.index);
    const circle = L.circleMarker([d.lat, d.lon], {
      radius: d.index / 5 + 10,
      color, fillColor: color,
      fillOpacity: 0.7, weight: 2,
    }).addTo(map);
    circle.bindPopup(`
      <div style="font-family:Arial;min-width:200px;padding:8px">
        <h3 style="color:#00bcd4;margin:0 0 8px">💧 ${d.city}</h3>
        <b>📊 Индекс:</b> ${d.index}%<br>
        <b>🤖 AI:</b> ${label}<br><hr style="margin:6px 0">
        <b>🌡️</b> ${d.temp}°C &nbsp;
        <b>💧</b> ${d.humidity}% &nbsp;
        <b>🌬️</b> ${d.wind} м/с<br>
        <b>⚙️</b> ${d.tech}
      </div>
    `, { maxWidth: 240 });
    circle.bindTooltip(`${d.city}: ${d.index}% | ${label}`);
    markers.push(circle);
  });
}

function renderCharts(data) {
  const cities  = data.map(d => d.city);
  const indexes = data.map(d => d.index);
  const humids  = data.map(d => d.humidity);
  const temps   = data.map(d => d.temp);
  const colors  = data.map(d => getColor(d.index));

  const opts = {
    responsive: true,
    plugins: { legend: { labels: { color: '#90caf9' } } },
    scales: {
      x: { ticks: { color: '#90caf9' }, grid: { color: '#1e3a5f' } },
      y: { ticks: { color: '#90caf9' }, grid: { color: '#1e3a5f' } },
    }
  };

  if (indexChart) indexChart.destroy();
  indexChart = new Chart(document.getElementById('indexChart'), {
    type: 'bar',
    data: {
      labels: cities,
      datasets: [{
        label: 'Конденсация индексі (%)',
        data: indexes,
        backgroundColor: colors,
        borderRadius: 6,
      }]
    },
    options: { ...opts, scales: { ...opts.scales, y: { ...opts.scales.y, max: 100 } } }
  });

  if (humidChart) humidChart.destroy();
  humidChart = new Chart(document.getElementById('humidChart'), {
    type: 'bar',
    data: {
      labels: cities,
      datasets: [
        { label: 'Ылғалдылық (%)', data: humids, backgroundColor: '#1565c0', borderRadius: 6 },
        { label: 'Температура (°C)', data: temps, backgroundColor: '#b71c1c', borderRadius: 6 },
      ]
    },
    options: opts
  });
}

function renderAI(data, best) {
  document.getElementById('aiText').innerHTML = `
    Қазақстанның Каспий жағалауындағы <b>${data.length} аймақтың</b>
    нақты уақыттағы климаттық деректері талданды.<br>
    <b>Ең тиімді аймақ: ${best.city}</b> —
    конденсация индексі <b>${best.index}%</b>,
    ылғалдылық ${best.humidity}%,
    температура ${best.temp}°C,
    шық нүктесі ${best.dew}°C.<br>
    Ұсынылатын технология: <b>⚙️ ${best.tech}</b>.<br>
    Буланған судың белгілі бір бөлігін конденсация арқылы қайтару —
    Каспийдің су балансын қалпына келтірудің энергия тиімді жолы.
  `;
}

async function loadData() {
  try {
    const res  = await fetch('/api/weather');
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);

    const data = json.data;
    const best = data.reduce((a, b) => a.index > b.index ? a : b);
    const time = new Date(json.time).toLocaleString('kk-KZ');

    document.getElementById('timeLabel').textContent = time;
    document.getElementById('bestBanner').innerHTML =
      `🏆 Ең тиімді аймақ: <span>${best.city}</span> — ` +
      `Индекс: <span>${best.index}%</span> | ⚙️ <span>${best.tech}</span>`;

    renderCards(data);
    renderMap(data);
    renderCharts(data);
    renderAI(data, best);
    document.getElementById('loader').style.display = 'none';

  } catch (e) {
    document.getElementById('loader').innerHTML =
      `<div style="color:#f44336">❌ Қате: ${e.message}</div>`;
  }
}

loadData();
// Әр 10 минут сайын жаңарту
setInterval(loadData, 10 * 60 * 1000);
</script>
</body>
</html>
